<script>
  /* ---------- Materiales ---------- */
  var M = {
    glass: function (c, op) {
      return new THREE.MeshPhysicalMaterial({ color: c, transparent: true, opacity: op == null ? 0.35 : op, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.6, depthWrite: false });
    },
    gloss: function (c) {
      return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.28, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 1.2, side: THREE.DoubleSide });
    },
    matte: function (c, metal) {
      return new THREE.MeshStandardMaterial({ color: c, roughness: 0.55, metalness: metal || 0.05, envMapIntensity: 0.9 });
    },
    black: function (c) {
      return new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.35, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.2, envMapIntensity: 0.35 });
    },
    gold: function () {
      return new THREE.MeshStandardMaterial({ color: 0xd4b078, roughness: 0.22, metalness: 1, envMapIntensity: 1.5 });
    },
    mirror: function () {
      return new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.04, metalness: 1, envMapIntensity: 1.6 });
    }
  };

  /* ---------- Ayudas de geometría ---------- */
  function lathe(pts, seg) {
    return new THREE.LatheGeometry(pts.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), seg || 64);
  }
  function cyl(rBottom, rTop, y0, y1, mat, seg) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, y1 - y0, seg || 48), mat);
    m.position.y = (y0 + y1) / 2;
    return m;
  }
  function smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

  /* ---------- Modelos ---------- */
  function buildTube() {
    var g = new THREE.Group();
    var pink = M.gloss(0xf3bfca);
    g.add(cyl(0.34, 0.34, 0, 0.55, M.gloss(0xfaf1ef)));
    g.add(cyl(0.355, 0.355, 0.5, 0.57, M.gold()));
    var pts = [];
    for (var y = 0.55; y <= 2.62; y += 0.05) {
      var r = y < 0.95 ? 0.34 + (0.5 - 0.34) * smooth((y - 0.55) / 0.4) : 0.5;
      pts.push([r, y]);
    }
    var geo = lathe(pts, 64);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var yy = pos.getY(i);
      var f = yy > 1.9 ? 1 - 0.93 * smooth((yy - 1.9) / 0.65) : 1;
      pos.setZ(i, pos.getZ(i) * f);
    }
    geo.computeVertexNormals();
    g.add(new THREE.Mesh(geo, pink));
    var seal = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.36, 0.09), pink);
    seal.position.y = 2.72;
    g.add(seal);
    var groove = M.matte(0xd99aa8);
    for (var k = 0; k < 5; k++) {
      var gr = new THREE.Mesh(new THREE.BoxGeometry(1.01, 0.012, 0.095), groove);
      gr.position.y = 2.6 + k * 0.06;
      g.add(gr);
    }
    return g;
  }

  function buildJar() {
    var g = new THREE.Group();
    g.add(cyl(0.93, 0.93, 0.12, 0.82, M.matte(0xfbe6e3)));
    var glass = new THREE.Mesh(lathe([[0, 0], [0.9, 0], [0.97, 0.06], [1.0, 0.2], [1.0, 0.9]], 64), M.glass(0xf6cfd6, 0.4));
    g.add(glass);
    g.add(cyl(1.012, 1.012, 0.9, 0.96, M.gold(), 64));
    var lid = new THREE.Mesh(lathe([[0, 0.96], [1.0, 0.96], [1.0, 1.35], [0.97, 1.45], [0.85, 1.5], [0, 1.5]], 64), M.gloss(0xf2b8c2));
    g.add(lid);
    return g;
  }

  function buildMist() {
    var g = new THREE.Group();
    g.add(cyl(0.5, 0.5, 0.1, 1.75, M.gloss(0xf8c9d2), 48));
    g.add(new THREE.Mesh(lathe([[0, 0], [0.5, 0], [0.55, 0.06], [0.55, 1.75], [0.5, 1.9], [0.3, 2.0]], 48), M.glass(0xffffff, 0.28)));
    g.add(cyl(0.3, 0.3, 2.0, 2.3, M.black(0x120c0f), 40));
    g.add(cyl(0.22, 0.18, 2.3, 2.75, M.black(0x120c0f), 32));
    var nozzle = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.3), M.black(0x120c0f));
    nozzle.position.set(0, 2.65, 0.22);
    g.add(nozzle);
    return g;
  }

  function buildLipstick() {
    var g = new THREE.Group();
    var black = M.black(0x120c0f);
    g.add(cyl(0.3, 0.3, 0, 0.95, black));
    g.add(cyl(0.31, 0.31, 0.95, 1.15, M.gold()));
    g.add(cyl(0.27, 0.27, 1.15, 1.55, M.matte(0xe2dcd6, 0.7)));
    var bg = new THREE.CylinderGeometry(0.24, 0.24, 0.7, 48, 6);
    var p = bg.attributes.position;
    for (var i = 0; i < p.count; i++) {
      var y = p.getY(i);
      if (y > 0.34) p.setY(i, y + p.getX(i) * 0.5 + 0.05);
    }
    bg.computeVertexNormals();
    var bullet = new THREE.Mesh(bg, M.gloss(0xe0728f));
    bullet.position.y = 1.9;
    g.add(bullet);
    var cap = new THREE.Group();
    cap.add(cyl(0.31, 0.31, 0, 1.75, black));
    cap.add(cyl(0.315, 0.315, 0, 0.2, M.gold()));
    cap.position.x = 0.95;
    g.add(cap);
    return g;
  }

  function buildMascara() {
    var g = new THREE.Group();
    var black = M.black(0x120c0f);
    g.add(cyl(0.4, 0.4, 0, 1.5, black));
    g.add(cyl(0.405, 0.405, 0.7, 0.95, M.gloss(0xf0a2b6)));
    g.add(cyl(0.41, 0.41, 1.5, 1.66, M.gold()));
    g.add(cyl(0.37, 0.37, 1.66, 3.2, black));
    var dome = new THREE.Mesh(new THREE.SphereGeometry(0.37, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), black);
    dome.position.y = 3.2;
    g.add(dome);
    return g;
  }

  function buildCompact() {
    var g = new THREE.Group();
    var black = M.black(0x120c0f);
    g.add(cyl(1, 1, 0, 0.22, black, 64));
    var rim = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.02, 12, 80), M.gold());
    rim.rotation.x = Math.PI / 2; rim.position.y = 0.22;
    g.add(rim);
    var tones = [0xe9b8b4, 0xd98a97, 0xb85a73, 0xf3d1c4];
    var spots = [[-0.4, -0.4], [0.4, -0.4], [-0.4, 0.4], [0.4, 0.4]];
    for (var i = 0; i < 4; i++) {
      var pan = cyl(0.33, 0.33, 0.2, 0.28, M.matte(tones[i], 0.3), 40);
      pan.position.x = spots[i][0]; pan.position.z = spots[i][1];
      g.add(pan);
    }
    var pivot = new THREE.Group();
    pivot.position.set(0, 0.22, -1);
    pivot.rotation.x = -1.75;
    var lid = cyl(1, 1, -0.07, 0.07, black, 64);
    lid.position.z = 1;
    pivot.add(lid);
    var mir = cyl(0.88, 0.88, 0, 0.02, M.mirror(), 64);
    mir.position.set(0, -0.075, 1);
    pivot.add(mir);
    g.add(pivot);
    return g;
  }

  function buildPerfume() {
    var g = new THREE.Group();
    var q = Math.PI / 8;
    var liquid = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.86, 1.5, 8), new THREE.MeshPhysicalMaterial({ color: 0xf5b6c2, roughness: 0.15, clearcoat: 1, envMapIntensity: 1.2, flatShading: true }));
    liquid.rotation.y = q; liquid.position.y = 0.95;
    g.add(liquid);
    var glass = new THREE.Mesh(new THREE.CylinderGeometry(0.88, 0.96, 1.7, 8), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.03, clearcoat: 1, envMapIntensity: 1.8, depthWrite: false, flatShading: true }));
    glass.rotation.y = q; glass.position.y = 0.9;
    g.add(glass);
    var foot = new THREE.Mesh(new THREE.CylinderGeometry(0.96, 0.98, 0.12, 8), M.glass(0xffffff, 0.5));
    foot.rotation.y = q; foot.position.y = 0.06;
    g.add(foot);
    g.add(cyl(0.32, 0.32, 1.75, 2.0, M.gold(), 40));
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.55, 0.95, 8), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0.03, clearcoat: 1, envMapIntensity: 2, depthWrite: false, flatShading: true }));
    cap.rotation.y = q; cap.position.y = 2.47;
    g.add(cap);
    g.add(cyl(0.18, 0.18, 2.0, 2.4, M.gold(), 32));
    return g;
  }

  /* ---------- Catálogo ---------- */
  var P = [
    { id: 'limpiador', cat: 'piel', name: 'Limpiador facial', color: '#f0b6c0', build: buildTube,
      desc: 'Para empezar la rutina del día y cerrarla en la noche.',
      tips: ['Se usa en la mañana y en la noche', 'Pregúntame cuál va mejor con tu tipo de piel', 'Combina con crema y bruma del catálogo'] },
    { id: 'crema', cat: 'piel', name: 'Crema hidratante', color: '#f4c9c2', build: buildJar,
      desc: 'El paso que deja la piel suave y cómoda durante el día.',
      tips: ['Se aplica después de limpiar el rostro', 'Pregúntame por las opciones de día y de noche', 'Te ayudo a elegir la textura que prefieras'] },
    { id: 'bruma', cat: 'piel', name: 'Bruma facial', color: '#f6c7d0', build: buildMist,
      desc: 'Un toque de frescura para el rostro en cualquier momento del día.',
      tips: ['Se aplica a unos centímetros del rostro', 'Pregúntame por tamaños y aromas', 'Va bien antes o después del maquillaje'] },
    { id: 'labial', cat: 'maquillaje', name: 'Labial', color: '#e0728f', build: buildLipstick,
      desc: 'Color para completar el look, desde rosas suaves hasta tonos intensos.',
      tips: ['Pregúntame por los tonos disponibles', 'Te ayudo a elegir el que mejor va con tu piel', 'Combina con cualquier maquillaje del catálogo'] },
    { id: 'mascara', cat: 'maquillaje', name: 'Máscara de pestañas', color: '#3a2d30', build: buildMascara,
      desc: 'Pestañas definidas para el día a día o para una ocasión especial.',
      tips: ['Pregúntame por las opciones disponibles', 'Se aplica de la raíz hacia las puntas', 'Va muy bien con la paleta de sombras'] },
    { id: 'sombras', cat: 'maquillaje', name: 'Paleta de sombras', color: '#c26a80', build: buildCompact,
      desc: 'Varios tonos para armar un look de día o de noche.',
      tips: ['Incluye espejo para retocarte donde estés', 'Pregúntame por las paletas disponibles', 'Te muestro cómo combinar los tonos'] },
    { id: 'perfume', cat: 'fragancias', name: 'Perfume', color: '#e7a9b8', build: buildPerfume,
      desc: 'Una fragancia para acompañarte todo el día.',
      tips: ['Pregúntame por las fragancias disponibles', 'Es un buen detalle para regalar', 'Te ayudo a elegir según el aroma que prefieras'] }
  ];

</script>
<script>

(function () {
  'use strict';
  var stage = document.getElementById('stage2'), canvas = document.getElementById('gl2');
  if (typeof THREE === 'undefined') { document.getElementById('noGL2').hidden = false; canvas.hidden = true; return; }
  function V(x, y, z) { return new THREE.Vector3(x, y, z); }
  function mesh(geo, mat, x, y, z) { var m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); return m; }
  function box(w, h, d, mat, x, y, z) { return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z); }
  function tube(pts, r, mat) { return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, r, 12, false), mat); }
  function ext(pts, depth, bevel, mat, z, smoothShape) {
    var s = new THREE.Shape();
    if (smoothShape) {
      var c = pts.map(function (p) { return new THREE.Vector2(p[0], p[1]); }); c.push(c[0].clone());
      s.moveTo(c[0].x, c[0].y); s.splineThru(c.slice(1));
    } else { s.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]); s.closePath(); }
    var g = new THREE.ExtrudeGeometry(s, { depth: depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 5, curveSegments: 24 });
    g.translate(0, 0, -depth / 2);
    var m = new THREE.Mesh(g, mat); m.position.z = z || 0; return m;
  }
  // segmento entre dos puntos (cilindro)
  function rod(a, b, r, mat) {
    var d = new THREE.Vector3().subVectors(b, a), L = d.length();
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 16), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    return m;
  }

  /* ---------- Materiales ---------- */
  var paint = new THREE.MeshPhysicalMaterial({ color: 0x8a5a33, metalness: 0.45, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.0 });
  var black = new THREE.MeshStandardMaterial({ color: 0x17171b, roughness: 0.55, metalness: 0.2, envMapIntensity: 0.8 });
  var gloss = new THREE.MeshPhysicalMaterial({ color: 0x141418, roughness: 0.25, clearcoat: 1, envMapIntensity: 0.9 });
  var seatM = new THREE.MeshStandardMaterial({ color: 0x1c1b1f, roughness: 0.85 });
  var rubber = new THREE.MeshStandardMaterial({ color: 0x101012, roughness: 0.92 });
  var alu = new THREE.MeshStandardMaterial({ color: 0xa8acb2, metalness: 1, roughness: 0.32, envMapIntensity: 1.2 });
  var chrome = new THREE.MeshStandardMaterial({ color: 0xe8e8ea, metalness: 1, roughness: 0.12, envMapIntensity: 1.5 });
  var engineM = new THREE.MeshStandardMaterial({ color: 0x2b2c31, metalness: 0.6, roughness: 0.45 });
  var redM = new THREE.MeshStandardMaterial({ color: 0xc8202b, roughness: 0.4, metalness: 0.2 });
  var lensM = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xdfeaff, emissiveIntensity: 1.2, roughness: 0.1 });
  var tailM = new THREE.MeshStandardMaterial({ color: 0x9b0d18, emissive: 0xff2030, emissiveIntensity: 0.9, roughness: 0.2 });

  /* ---------- Moto (estilo Gixxer 150, naked) ---------- */
  function wheel(x, front) {
    var w = new THREE.Group(); w.position.set(x, 0.305, 0);
    var tire = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.056, 20, 64), rubber); w.add(tire);
    var rim = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.014, 10, 64), gloss); w.add(rim);
    for (var i = 0; i < 6; i++) {
      var a = i * Math.PI / 3, sp = box(0.17, 0.022, 0.024, gloss, Math.cos(a) * 0.11, Math.sin(a) * 0.11, 0);
      sp.rotation.z = a; w.add(sp);
    }
    var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.15, 24), alu); hub.rotation.x = Math.PI / 2; w.add(hub);
    var disc = new THREE.Mesh(new THREE.CylinderGeometry(front ? 0.14 : 0.11, front ? 0.14 : 0.11, 0.006, 40), chrome); disc.rotation.x = Math.PI / 2; disc.position.z = front ? 0.07 : -0.07; w.add(disc);
    var cal = box(0.07, 0.09, 0.04, front ? redM : black, front ? -0.1 : 0.08, front ? 0.08 : 0.07, front ? 0.075 : -0.075); w.add(cal);
    return w;
  }
